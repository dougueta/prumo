openapi: 3.1.0
info:
  title: Prumo — Auth (feature 006)
  version: 1.0.0
  description: >
    Route Handlers de autenticação. Todas as respostas têm `Cache-Control: no-store`.
    Nenhuma resposta contém tokens, códigos, e-mails de terceiros ou mensagens do provedor.
    Todo `Set-Cookie` emitido tem `HttpOnly; SameSite=Lax; Path=/` e `Secure` fora de `local`
    (FR-023, data-model §10). Todo POST exige `Origin` = `APP_ORIGIN`, senão `403 ORIGIN_MISMATCH`.
servers:
  - url: /
paths:
  /auth/callback:
    get:
      summary: Retorno do Google OAuth (PKCE)
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 512 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        "302":
          description: >
            Sucesso e e-mail ∈ allowlist ⇒ `Location: <cookie prumo_next | />` e sessão criada
            (evento `login_succeeded`, method `google`).
            E-mail ∉ allowlist ou cadastro recusado pelo Supabase ⇒ sessão revogada,
            `Location: /entrar?erro=recusado` (evento `email_refused`, e-mail mascarado).
            `code` ausente/inválido ou provedor indisponível ⇒ `Location: /entrar?erro=indisponivel`
            (evento `provider_error`).
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string }, description: "cookies sb-* e prumo_device (se ausente), todos HttpOnly" }
  /auth/sair:
    get:
      summary: Limpa cookies de sessão já encerrada/expirada/inválida (auth-flows §2.1)
      parameters:
        - { name: next, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        "302":
          description: >
            Sessão ACTIVE ou LOCKED ⇒ `Location: safeNext(next)` sem efeito (não desloga).
            Caso contrário ⇒ cookies de auth apagados e `Location: /entrar?next=…&erro=expirada`.
          headers:
            Location: { schema: { type: string } }
  /api/auth/status:
    get:
      summary: Estado da sessão para o SessionGuard (não renova `last_active_at`)
      responses:
        "200":
          description: Sessão existente
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state: { type: string, enum: [active, locked] }
                  canUnlock: { type: boolean, description: "existe credencial WebAuthn cadastrada NESTE dispositivo (prumo_device)" }
        "401":
          description: Sem sessão (UNAUTHENTICATED), expirada ou encerrada (SESSION_EXPIRED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Banco indisponível (UNAVAILABLE) — falha fechada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/webauthn/register/options:
    post:
      summary: Opções de cadastro da biometria/PIN (só até 10 min após entrada completa)
      responses:
        "200":
          description: PublicKeyCredentialCreationOptionsJSON (rp.id = host de APP_ORIGIN, userVerification required, authenticatorAttachment platform)
          content: { application/json: { schema: { type: object } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: Janela de cadastro encerrada (ENROLL_WINDOW_CLOSED) ou Origin inválido (ORIGIN_MISMATCH)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "423": { description: Sessão LOCKED, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/auth/webauthn/register/verify:
    post:
      summary: Verifica e grava a credencial vinculada ao `device_id` deste dispositivo (evento unlock_enrolled)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, description: RegistrationResponseJSON } } }
      responses:
        "201": { description: Cadastrada, content: { application/json: { schema: { type: object, properties: { ok: { const: true } } } } } }
        "400": { description: Asserção inválida ou desafio expirado, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /api/auth/webauthn/unlock/options:
    post:
      summary: Opções de autenticação para desbloquear sessão LOCKED
      responses:
        "200": { description: PublicKeyCredentialRequestOptionsJSON (allowCredentials = só as credenciais do dono com o device_id deste dispositivo; userVerification required), content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409":
          description: Sem credencial cadastrada neste dispositivo (NO_CREDENTIAL — exige entrada completa)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/auth/webauthn/unlock/verify:
    post:
      summary: Verifica a asserção e desbloqueia
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, description: AuthenticationResponseJSON } } }
      responses:
        "200": { description: Desbloqueada (evento session_unlocked), content: { application/json: { schema: { type: object, properties: { ok: { const: true } } } } } }
        "400":
          description: Falhou (unlock_failures+1, evento unlock_failed); `remaining` tentativas
          content: { application/json: { schema: { type: object, properties: { error: { const: UNLOCK_FAILED }, remaining: { type: integer, minimum: 0, maximum: 4 } } } } }
        "401":
          description: Sessão encerrada (5ª falha ⇒ end_reason unlock_failures) ou inexistente
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [UNAUTHENTICATED, LOCKED, SESSION_EXPIRED, UNAVAILABLE, ORIGIN_MISMATCH, ENROLL_WINDOW_CLOSED, NO_CREDENTIAL, CHALLENGE_EXPIRED, INVALID] }
  responses:
    Unauthenticated:
      description: Sem sessão válida
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
